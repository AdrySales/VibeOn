<div class="px-6 pt-6 pb-8">
  <div class="text-center mb-6">
    <h1
      class="text-4xl font-bold bg-gradient-to-r from-[#F8FAFC] to-[#C4B5FD] bg-clip-text text-transparent"
    >
      VibeOn
    </h1>
    <p class="text-[#94A3B8] text-xs mt-1">crie sua conta</p>
  </div>

  <!-- Seletor de tipo de conta -->
  <div class="flex gap-3 mb-6">
    <button
      id="btnTipoUser"
      class="flex-1 py-2 rounded-full bg-[#7C3AED] text-white font-semibold transition"
    >
      Usuário
    </button>
    <button
      id="btnTipoEmpresa"
      class="flex-1 py-2 rounded-full bg-[#1E293B] text-[#94A3B8] font-semibold transition"
    >
      Empresa
    </button>
  </div>

  <!-- Campos comuns -->
  <div>
    <label class="block text-[#CBD5E1] text-sm mb-1">Nome / Razão Social</label>
    <input
      type="text"
      id="cadNome"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
    />
  </div>
  <div class="mt-3">
    <label class="block text-[#CBD5E1] text-sm mb-1">Email</label>
    <input
      type="email"
      id="cadEmail"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
    />
  </div>
  <div class="mt-3">
    <label class="block text-[#CBD5E1] text-sm mb-1">Senha</label>
    <input
      type="password"
      id="cadSenha"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
    />
  </div>
  <div class="mt-3">
    <label class="block text-[#CBD5E1] text-sm mb-1">Telefone</label>
    <input
      type="tel"
      id="cadTelefone"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
    />
  </div>

  <!-- Campos específicos para empresa (inicialmente ocultos) -->
  <div id="empresaFields" class="hidden space-y-3 mt-3">
    <div>
      <label class="block text-[#CBD5E1] text-sm mb-1"
        >Endereço do estabelecimento</label
      >
      <input
        type="text"
        id="cadEndereco"
        class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
      />
    </div>
    <div>
      <label class="block text-[#CBD5E1] text-sm mb-1">Categoria</label>
      <select
        id="cadCategoria"
        class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
      >
        <option value="bar">Bar</option>
        <option value="restaurante">Restaurante</option>
        <option value="casa_show">Casa de Show</option>
      </select>
    </div>
    <div>
      <label class="block text-[#CBD5E1] text-sm mb-1"
        >Descrição (opcional)</label
      >
      <textarea
        id="cadDescricao"
        rows="2"
        class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl"
      ></textarea>
    </div>
  </div>

  <button
    id="btnCadastrar"
    class="w-full mt-5 bg-[#7C3AED] hover:bg-[#6D28D9] text-white font-bold py-3 rounded-full transition"
  >
    CRIAR CONTA
  </button>
  <button
    id="voltarLogin"
    class="w-full text-[#7C3AED] text-sm mt-3 hover:underline"
  >
    ← Já tenho conta
  </button>
</div>
