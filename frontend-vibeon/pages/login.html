<div class="px-6 pt-10 pb-8">
  <!-- LOGO (adicione sua imagem aqui) -->
  <div class="flex justify-center">
    <img src="../css/logo.png" alt="Logo VibeOn" class="h-[15rem] w-auto" />
  </div>

  <!-- Subtítulo -->
  <div class="text-center mb-2">
    <h2 class="text-[#6D28D9] text-xl font-semibold">
      Faça o login e sinta a VibeOn
    </h2>
  </div>

  <!-- Campos de login -->
  <div class="mb-4">
    <label class="block text-[#CBD5E1] text-sm mb-1">Email</label>
    <input
      type="email"
      id="loginEmail"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#7C3AED]"
    />
  </div>
  <div class="mb-6">
    <label class="block text-[#CBD5E1] text-sm mb-1">Senha</label>
    <input
      type="password"
      id="loginSenha"
      class="w-full bg-[#1E293B] border border-[#334155] text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#7C3AED]"
    />
  </div>

  <!-- Botão de login -->
  <button
    id="btnLogin"
    class="w-full bg-[#7C3AED] hover:bg-[#6D28D9] text-white font-bold py-3 rounded-full transition duration-200"
  >
    LOG IN
  </button>

  <!-- Link para cadastro -->
  <div class="flex justify-center mt-6">
    <a
      href="#"
      id="mostrarCadastro"
      class="text-[#22C55E] hover:text-[#4ADE80] transition"
    >
      Ainda não tem conta? <strong>CADASTRE-SE</strong>
    </a>
  </div>
</div>
